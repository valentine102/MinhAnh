<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030407">
<title>Lời chúc pixel dành cho Minh Anh</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030407; }
body { font-family: Arial, Helvetica, sans-serif; overscroll-behavior: none; }
#screen { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #030407; touch-action: none; }
</style>
</head>
<body>
<canvas id="screen" aria-label="Các pixel tạo thành lời chúc"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

  const WISHES = [
    'Mong em luôn vui nha!',
    'Hôm nay nhớ cười thật nhiều nhé!',
    'Chúc em xinh đẹp mỗi ngày!',
    'Tuổi 30 vẫn đáng yêu hết phần thiên hạ!',
    'Mong mọi điều tốt đẹp đều tìm đến em!',
    'Ăn ngon, ngủ ngoan, luôn bình an nha!',
    'Chúc cô gái nhỏ luôn được cưng chiều!',
    'Hôm nay cũng phải thương bản thân nhiều hơn đó!',
    'Chúc em gặp được người yêu thương em hết lòng!',
    'Gửi đến em ngàn lời chúc dễ thương nhất!',
    'Chúc mừng sinh nhật!',
    'Happy Birthday!',
    '31-12-2026',
    'Minh Anh ❤️'
  ];

  // Các cột nền dùng nguyên câu chúc, mỗi ký tự nằm trên một hàng dọc riêng.
  const glyphPool = Array.from(WISHES.join('   ')).filter(ch => ch !== '\uFE0F' && ch !== '\u200D');

  const sequence = [
    { type: 'countdown', text: '3', duration: 1080, mix: 80 },
    { type: 'countdown', text: '2', duration: 1080, mix: 80 },
    { type: 'countdown', text: '1', duration: 1180, mix: 80 },
    ...WISHES.map((text, i) => ({ type: 'text', text, duration: i >= 10 ? 4300 : 4100, mix: 930 })),
    { type: 'heart', text: '', duration: Infinity, mix: 900 }
  ];

  let W = 0, H = 0, dpr = 1;
  const maskScale = 0.80;
  let particles = [], streams = [], dust = [];
  let sceneIndex = -1, sceneStart = 0, lastTime = 0, resizeTimer = 0;

  const rand = (min, max) => min + Math.random() * (max - min);

  function makeBackground() {
    // Mỗi dòng dọc mang trọn một lời chúc; ký tự được xếp lần lượt từ trên xuống dưới.
    const count = Math.max(5, Math.min(9, Math.floor(W / 48)));
    const step = 12.5;
    streams = Array.from({ length: count }, (_, i) => {
      const text = Array.from(WISHES[(i + Math.floor(Math.random() * WISHES.length)) % WISHES.length])
        .filter(ch => ch !== '\uFE0F' && ch !== '\u200D');
      const size = 10.5;
      const span = text.length * step;
      return {
        text,
        x: W * (i + 0.5) / count + rand(-5, 5),
        y: rand(0, Math.max(0, H - span)),
        speed: rand(68,86),
        size,
        step,
        brightness: rand(0.12, 0.25)
      };
    });
    dust = Array.from({ length: Math.min(90, Math.floor(W * H / 6200)) }, () => ({
      x: rand(0, W), y: rand(0, H), r: rand(0.45, 0.9), a: rand(0.035, 0.13),
      tw: rand(0.4, 1.2), phase: rand(0, Math.PI * 2)
    }));
  }

  // A tiny visual gap before punctuation keeps pixelated punctuation from touching the previous glyph.
  function spacedPunctuation(text) {
    return text.replace(/\s*([,.;:!?])/g, '\u2009$1');
  }

  function wrapText(text, maxWidth, measureCtx) {
    const words = String(text).trim().split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';
    for (const word of words) {
      const candidate = line ? line + ' ' + word : word;
      if (line && measureCtx.measureText(spacedPunctuation(candidate)).width > maxWidth) {
        lines.push(spacedPunctuation(line));
        line = word;
      } else {
        line = candidate;
      }
    }
    if (line) lines.push(spacedPunctuation(line));
    return lines.length ? lines : [' '];
  }

  function makeTextTargets(text, isCountdown = false) {
    const off = document.createElement('canvas');
    const mw = Math.max(1, Math.ceil(W * maskScale));
    const mh = Math.max(1, Math.ceil(H * maskScale));
    off.width = mw;
    off.height = mh;
    const m = off.getContext('2d', { willReadFrequently: true });
    m.setTransform(maskScale, 0, 0, maskScale, 0, 0);

    const maxWidth = W * (isCountdown ? 0.70 : 0.90);
    let fs, lines;
    if (isCountdown) {
      fs = Math.min(148, W * 0.42, H * 0.20);
      m.font = `800 ${fs}px Arial, Helvetica, sans-serif`;
      lines = [text];
    } else {
      fs = Math.min(62, W * 0.16, H * 0.092);
      // Wrap longer greetings instead of squeezing them into tiny, blurry lettering.
      for (; fs >= 25; fs -= 1) {
        m.font = `700 ${fs}px Arial, Helvetica, sans-serif`;
        lines = wrapText(text, maxWidth, m);
        if (lines.length <= 3 && lines.every(line => m.measureText(line).width <= maxWidth)) break;
      }
      m.font = `700 ${fs}px Arial, Helvetica, sans-serif`;
      lines = wrapText(text, maxWidth, m);
    }

    m.fillStyle = '#fff';
    m.textAlign = 'center';
    m.textBaseline = 'middle';
    try { m.letterSpacing = isCountdown ? '1px' : '0.45px'; } catch (_) {}
    const lineHeight = isCountdown ? fs * 1.12 : fs * 1.24;
    const startY = H * 0.50 - (lines.length - 1) * lineHeight * 0.5;
    lines.forEach((line, i) => m.fillText(line, W * 0.5, startY + i * lineHeight));

    const data = m.getImageData(0, 0, mw, mh).data;
    const points = [];
    // Fine grid spacing makes filled letter strokes look crisp and connected, not like sparse dots.
    for (let y = 0; y < mh; y += 1) {
      for (let x = 0; x < mw; x += 1) {
        if (data[(y * mw + x) * 4 + 3] > 92) points.push({ x: x / maskScale, y: y / maskScale });
      }
    }
    return points;
  }

  function makeHeartTargets() {
    const off = document.createElement('canvas');
    const mw = Math.max(1, Math.ceil(W * maskScale));
    const mh = Math.max(1, Math.ceil(H * maskScale));
    off.width = mw; off.height = mh;
    const m = off.getContext('2d', { willReadFrequently: true });
    m.setTransform(maskScale, 0, 0, maskScale, 0, 0);
    const cx = W * 0.5, cy = H * 0.50;
    const hw = Math.min(W * 0.25, 112), hh = Math.min(H * 0.105, 82);
    m.beginPath();
    m.moveTo(cx, cy + hh * 0.76);
    m.bezierCurveTo(cx - hw * 1.18, cy + hh * 0.04, cx - hw * 1.04, cy - hh * 0.92, cx - hw * 0.45, cy - hh * 0.92);
    m.bezierCurveTo(cx - hw * 0.13, cy - hh * 0.92, cx, cy - hh * 0.66, cx, cy - hh * 0.46);
    m.bezierCurveTo(cx, cy - hh * 0.66, cx + hw * 0.13, cy - hh * 0.92, cx + hw * 0.45, cy - hh * 0.92);
    m.bezierCurveTo(cx + hw * 1.04, cy - hh * 0.92, cx + hw * 1.18, cy + hh * 0.04, cx, cy + hh * 0.76);
    m.closePath();
    m.strokeStyle = '#fff';
    m.lineWidth = 3.0;
    m.stroke();
    const data = m.getImageData(0, 0, mw, mh).data;
    const points = [];
    for (let y = 0; y < mh; y += 1) {
      for (let x = 0; x < mw; x += 1) {
        if (data[(y * mw + x) * 4 + 3] > 62 && Math.random() > 0.08) {
          points.push({ x: x / maskScale + rand(-0.35, 0.35), y: y / maskScale + rand(-0.35, 0.35) });
        }
      }
    }
    return points;
  }

  function showScene(index, now = performance.now(), onResize = false) {
    sceneIndex = Math.min(index, sequence.length - 1);
    sceneStart = now;
    const scene = sequence[sceneIndex];
    const targets = scene.type === 'heart' ? makeHeartTargets() : makeTextTargets(scene.text, scene.type === 'countdown');
    const old = particles;
    const next = [];

    for (let i = 0; i < targets.length; i++) {
      const p = old.pop() || {
        x: rand(0, W), y: rand(0, H), vx: 0, vy: 0,
        alpha: rand(0.72, 1), size: rand(1.35, 1.65)
      };
      p.tx = targets[i].x;
      p.ty = targets[i].y;
      p.scatterX = rand(0, W);
      p.scatterY = rand(0, H);
      p.fadeOut = false;
      p.fadeStart = 0;
      p.heart = scene.type === 'heart';
      p.countdown = scene.type === 'countdown';
      p.alpha = rand(0.75, 1);
      p.size = p.countdown ? rand(1.75, 2.05) : (p.heart ? rand(1.4, 1.8) : rand(1.45, 1.72));
      p.tone = Math.random();
      next.push(p);
    }
    for (const p of old) {
      p.scatterX = rand(0, W);
      p.scatterY = rand(0, H);
      p.fadeOut = true;
      p.fadeStart = now;
      next.push(p);
    }
    particles = next;

    if (onResize) {
      // Reposition to a neutral spread after rotating the phone; keep the current scene active.
      for (const p of particles) {
        if (!p.fadeOut) { p.x = p.scatterX; p.y = p.scatterY; }
      }
    }
  }

  function resize() {
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 1.15);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    makeBackground();
    if (sceneIndex < 0) showScene(0, performance.now());
    else showScene(sceneIndex, performance.now(), true);
  }

  function drawBackground(now, dt) {
    ctx.fillStyle = '#030407';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const s of streams) {
      s.y += s.speed * dt;
      const span = s.text.length * s.step;
      if (s.y > H + 8) {
        s.text = Array.from(WISHES[Math.floor(Math.random() * WISHES.length)])
          .filter(ch => ch !== '\uFE0F' && ch !== '\u200D');
        s.y = -s.text.length * s.step;
        s.x = rand(8, W - 8);
      }
      ctx.font = `500 ${s.size}px Arial, Helvetica, sans-serif`;
      for (let j = 0; j < s.text.length; j++) {
        const yy = s.y + j * s.step;
        if (yy < -14 || yy > H + 14) continue;
        const char = s.text[j];
        const head = j === 0;
        const alpha = s.brightness * (1 - j / (s.text.length * 1.45));
        ctx.fillStyle = head
          ? `rgba(222,232,240,${Math.min(0.76, alpha * 1.7)})`
          : `rgba(143,164,181,${Math.max(0.025, alpha)})`;
        ctx.fillText(char, s.x, yy);
      }
    }
    for (const d of dust) {
      const flicker = 0.64 + 0.36 * Math.sin(now * 0.001 * d.tw + d.phase);
      ctx.fillStyle = `rgba(190,205,218,${d.a * flicker})`;
      ctx.fillRect(d.x, d.y, d.r, d.r);
    }
  }

  function frame(now) {
    const dt = lastTime ? Math.min(0.04, (now - lastTime) / 1000) : 1 / 60;
    lastTime = now;
    drawBackground(now, dt);

    const before = sequence[sceneIndex];
    if (sceneIndex < sequence.length - 1 && Number.isFinite(before.duration) && now - sceneStart >= before.duration) {
      showScene(sceneIndex + 1, now);
    }
    const scene = sequence[sceneIndex];
    const age = now - sceneStart;
    const isMixing = age < scene.mix;
    const spreadEase = 1 - Math.pow(0.96, dt * 60);
    const gatherEase = 1 - Math.pow(0.84, dt * 60);
    const textBuckets = [[], [], [], []];
    const heartBuckets = [[[], [], [], []], [[], [], [], []]];
    const alphaLevels = [0.42, 0.60, 0.78, 0.97];
    const pulse = 0.83 + 0.17 * Math.sin(now * 0.0036);

    for (const p of particles) {
      const tx = isMixing ? p.scatterX : p.tx;
      const ty = isMixing ? p.scatterY : p.ty;
      const movement = isMixing ? spreadEase : gatherEase;
      p.x += (tx - p.x) * movement;
      p.y += (ty - p.y) * movement;
      let alpha = p.alpha;
      if (p.fadeOut) alpha *= Math.max(0, 1 - (now - p.fadeStart) / 640);
      if (alpha < 0.08) continue;
      const bucket = Math.min(3, Math.floor(alpha * 4));
      if (p.heart) heartBuckets[p.tone > 0.72 ? 1 : 0][bucket].push(p);
      else textBuckets[bucket].push(p);
    }

    for (let b = 0; b < 4; b++) {
      if (!textBuckets[b].length) continue;
      ctx.beginPath();
      for (const p of textBuckets[b]) ctx.rect(p.x, p.y, p.size, p.size);
      ctx.fillStyle = `rgba(242,247,252,${alphaLevels[b]})`;
      ctx.fill();
    }
    for (let tone = 0; tone < 2; tone++) {
      for (let b = 0; b < 4; b++) {
        const bucket = heartBuckets[tone][b];
        if (!bucket.length) continue;
        ctx.beginPath();
        for (const p of bucket) {
          const size = p.size * pulse;
          ctx.rect(p.x, p.y, size, size);
        }
        ctx.fillStyle = tone
          ? `rgba(255,232,255,${alphaLevels[b] * pulse})`
          : `rgba(219,157,255,${alphaLevels[b] * pulse})`;
        ctx.fill();
      }
    }

    if (particles.length && Math.floor(now / 250) !== Math.floor((now - dt * 1000) / 250)) {
      particles = particles.filter(p => !p.fadeOut || now - p.fadeStart < 640);
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  }, { passive: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) lastTime = 0; });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
